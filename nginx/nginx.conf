# Only send "Connection: upgrade" when the client actually requests a WebSocket upgrade,
# so regular HTTP requests keep upstream keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 200M;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # $http_host keeps the port (e.g. 10.100.14.6:8085), so anything the apps build
    # from the Host header points back to the port the browser used.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Next.js static asset caching
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Specific backend auth action endpoints (Express API)
    location ~ ^/api/auth/(login|logout|request-otp|verify-otp|reset-password) {
        proxy_pass http://backend:4000;
    }

    # NextAuth routes (Next.js auth session, csrf, callback)
    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    # General Backend REST API
    location /api {
        proxy_pass http://backend:4000;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Static file uploads served by backend Express
    location /uploads {
        proxy_pass http://backend:4000/uploads;
    }

    # Socket.IO WebSocket and Long-Polling proxy
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Frontend (Next.js Application)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
