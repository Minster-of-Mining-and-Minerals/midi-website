services:
  db:
    image: postgres:16-alpine
    container_name: midi_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-midi_portal}
      TZ: UTC
    volumes:
      - midi_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-midi_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - midi_prod_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: midi_backend_prod
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4005}:4000"
      - "${SOCKET_PORT:-5005}:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-midi_portal}
      - PORT=4000
      - SOCKET_PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://10.100.14.6:3005}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://10.100.14.6:3005,http://10.100.14.6:8085}
      - TZ=UTC
      - APP_TIMEZONE=Africa/Addis_Ababa
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - midi_prod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://10.100.14.6:4005/api}
        - NEXT_PUBLIC_BASE=${NEXT_PUBLIC_BASE:-http://10.100.14.6:4005}
        - NEXT_PUBLIC_FILE_URL=${NEXT_PUBLIC_FILE_URL:-http://10.100.14.6:4005}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://10.100.14.6:3005}
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://10.100.14.6:5005}
        - NEXT_PUBLIC_TIMEZONE=${NEXT_PUBLIC_TIMEZONE:-Africa/Addis_Ababa}
    container_name: midi_frontend_prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://backend:4000/api
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://10.100.14.6:4005/api}
      - NEXT_PUBLIC_BASE=${NEXT_PUBLIC_BASE:-http://10.100.14.6:4005}
      - NEXT_PUBLIC_FILE_URL=${NEXT_PUBLIC_FILE_URL:-http://10.100.14.6:4005}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://10.100.14.6:3005}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://10.100.14.6:5005}
      - NEXT_PUBLIC_TIMEZONE=${NEXT_PUBLIC_TIMEZONE:-Africa/Addis_Ababa}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://10.100.14.6:3005/api/auth}
      - NEXTAUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${AUTH_URL:-http://10.100.14.6:3005/api/auth}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - midi_prod_network

  nginx:
    image: nginx:stable-alpine
    container_name: midi_nginx_prod
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8085}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - midi_prod_network

volumes:
  midi_postgres_data_prod:
    name: midi_postgres_data_prod

networks:
  midi_prod_network:
    name: midi_prod_network
    driver: bridge
